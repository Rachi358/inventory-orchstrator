
services:
  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-orchestrator
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Enterprise Inventory Orchestrator
      DATABASE_URL: sqlite+aiosqlite:///./data/enterprise_inventory.db
      API_KEY_SECRET: ${API_KEY_SECRET:-docker-development-secret}
    volumes:
      - inventory_data:/app/data
    command: >
      sh -c "python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

    restart: unless-stopped

volumes:
  inventory_data:
